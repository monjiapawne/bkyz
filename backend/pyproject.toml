[project]
name = "bkyz"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "flask_sqlalchemy",
    "flask_migrate",
    "flask-login",
    "flask-cors",
    "requests",
    "spectree",
]

[tool.ruff]
line-length = 100
exclude = [
    "migrations"
]


[dependency-groups]
test = ["pytest"]
