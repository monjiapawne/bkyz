<dialog #modal class="fixed inset-0 m-auto w-full max-w-md p-6 bg-white rounded-xl shadow-xl border border-gray-200
    backdrop:bg-black/50 backdrop:backdrop-blur-sm
    open:flex open:flex-col gap-4">

    <div class="py-4 text-gray-700">

        <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="space-y-4">

            <div>
                <label for="title" class="block mb-1 font-medium">
                    Title
                </label>

                <input id="title" type="text" formControlName="title"
                    class="w-full rounded border border-gray-300 px-3 py-2" placeholder="Enter book title" />
            </div>

            <div>
                <label for="authors" class="block mb-1 font-medium">
                    Authors
                </label>

                <input id="authors" type="text" formControlName="authors"
                    class="w-full rounded border border-gray-300 px-3 py-2" placeholder="J.K. Rowling, Stephen King" />
            </div>

            <div>
                <label for="isbn" class="block mb-1 font-medium">
                    ISBN
                </label>

                <input id="isbn" type="text" formControlName="isbn"
                    class="w-full rounded border border-gray-300 px-3 py-2" />
            </div>

            <div>
                <label for="number_of_pages" class="block mb-1 font-medium">
                    Number of Pages
                </label>

                <input id="number_of_pages" type="number" formControlName="number_of_pages"
                    class="w-full rounded border border-gray-300 px-3 py-2" min="1" />
            </div>

            <div class="flex flex-col justify-center">

                <button type="submit" [disabled]="bookForm.invalid || isSubmitting()"
                    class="flex items-center justify-center gap-2 px-4 py-2 bg-[#5457ff] hover:bg-[#4c4ee6] text-white font-medium rounded-md my-4 disabled:opacity-50">

                    @if (isSubmitting()) {
                    <span class="h-5 w-5 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
                    <span>Adding...</span>
                    } @else {
                    <span>Add Book</span>
                    }

                </button>

                <button type="button" (click)="modal.close()"
                    class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-md">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</dialog>
