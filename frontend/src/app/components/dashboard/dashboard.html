<div class="flex gap-3 overflow-x-auto py-2 my-4 mx-auto max-w-7xl">
    @for (playlist of playlists(); track playlist.id) {
    <button type="button" [routerLink]="['/playlists', playlist.id]"
        class="shrink-0 rounded-lg bg-gray-200 px-4 py-2 hover:bg-gray-300">
        {{ playlist.name }}
    </button>
    }
</div>
