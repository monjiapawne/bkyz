<dialog #modal class="fixed inset-0 m-auto w-full max-w-md p-6 bg-white rounded-xl shadow-xl border border-gray-200
    backdrop:bg-black/50 backdrop:backdrop-blur-sm
    open:flex open:flex-col gap-4">

    <div class="py-4 text-gray-700">

        <form [formGroup]="trackForm" (ngSubmit)="onSubmit()" class="space-y-4">

            <div>
                <label for="position" class="block mb-1 font-medium">
                    Position
                </label>

                <input id="position" type="number" formControlName="position"
                    class="w-full rounded border border-gray-300 px-3 py-2" min="0" />
            </div>

            <div>
                <label for="total" class="block mb-1 font-medium">
                    Total
                </label>

                <input id="total" type="number" formControlName="total"
                    class="w-full rounded border border-gray-300 px-3 py-2" min="1" />
            </div>

            <div>
                <label for="unit" class="block mb-1 font-medium">
                    Unit
                </label>

                <select id="unit" formControlName="unit" class="w-full rounded border border-gray-300 px-3 py-2">
                    <option value="pages">Pages</option>
                    <option value="chapters">Chapters</option>
                    <option value="percent">Percent</option>
                    <option value="other">Other</option>
                </select>

                @if (trackForm.value.unit === 'other'){
                    <input type="text" formControlName="customUnit" placeholder="e.g. sections"
                    class="w-full rounded border border-gray-300 px-3 py-2 mt-2"/>
                }
            </div>

            <div>
                <label for="medium" class="block mb-1 font-medium">
                    Medium
                </label>

                <select id="medium" formControlName="medium" class="w-full rounded border border-gray-300 px-3 py-2">
                    <option value="physical">Physical</option>
                    <option value="ebook">E-book</option>
                    <option value="audiobook">Audiobook</option>
                </select>
            </div>

            <div class="flex flex-col justify-center">

                <button type="submit" [disabled]="trackForm.invalid || isSubmitting()"
                    class="flex items-center justify-center gap-2 px-4 py-2 bg-[#5457ff] hover:bg-[#4c4ee6] text-white font-medium rounded-md my-4 disabled:opacity-50">

                    @if (isSubmitting()) {
                    <span class="h-5 w-5 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
                    <span>Adding...</span>
                    } @else {
                    <span>Add Track</span>
                    }

                </button>

                <button type="button" (click)="modal.close()"
                    class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-md">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</dialog>
