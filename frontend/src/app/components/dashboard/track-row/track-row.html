<div class="flex">
    <div>
        <img [src]="book().cover_url" [alt]="book().title" class="h-48 w-auto object-cover mr-4">
    </div>

    <div>
        <div class="text-[#5457ff] font-bold text-xs">
            {{ track().medium | uppercase }}
        </div>
        <div class="font-bold text-2xl">
            {{ book().title }}
        </div>
        <div>
            {{ book().authors }}
        </div>
    </div>

    <div class="ml-auto flex">
        <svg class="size-6 mr-4" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
            <path d="M0 0h16v16H0z" fill="none" />
            <path fill="currentColor"
                d="m12.146 7.854l-5.932 5.932c-.14.14-.318.235-.511.274l-3.232.646a1 1 0 0 1-1.176-1.177l.646-3.232a1 1 0 0 1 .273-.51l5.932-5.933zm-1.353-6.647a1 1 0 0 1 1.414 0l2.586 2.586a1 1 0 0 1 0 1.414l-1.94 1.94l-4-4z" />
        </svg>

        <svg class="size-6" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 2048 2048">
            <path d="M0 0h2048v2048H0z" fill="none" />
            <path fill="currentColor"
                d="m1115 1024l690 691l-90 90l-691-690l-691 690l-90-90l690-691l-690-691l90-90l691 690l691-690l90 90z" />
        </svg>
    </div>
</div>

<div class="flex w-full items-center mt-4">
    <h1>{{ progress() }}%</h1>
    <div class="h-2 w-full overflow-hidden rounded-full bg-gray-200 ml-4">
        <div class="h-full rounded-full bg-[#5457ff]" [style.width.%]="progress()"></div>
    </div>
</div>
