<div class="flex justify-center items-center min-h-[calc(100dvh-120px)]">
    <form class="bg-[#cfcece38] border rounded-2xl border-[#969696a6] p-10">

        <svg class="mx-auto block m-6 w-24 h-24" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
            viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                stroke-miterlimit="10" stroke-width="1.5"
                d="M12 7.333C12 5.5 10.5 4 8.667 4H2v12h6.708C12 16 12 19.334 12 19.334m0-12C12 5.5 13.5 4 15.333 4H22v12h-6.667C12 16 12 19.334 12 19.334m0-12v12m1.875 1.124A2.58 2.58 0 0 1 16.167 19H21m-10.875 1.458A2.54 2.54 0 0 0 7.833 19H3" />
        </svg>

        <h1 class="font-bold text-5xl text-center mb-10 text-[rgb(26,26,26)]">Register</h1>
        @if(invalidRegisterErrorMessage())
        {
        <div class="text-xs max-w-xs text-center text-[#ff2929] mb-6">{{
            invalidRegisterErrorMessage() }}</div>
        }
        @if(accountCreatedSuccessMessage())
        {
        <div class="text-xs max-w-xs text-center text-[#5457ff] mb-6">{{
            accountCreatedSuccessMessage() }}</div>
        }

        <input name="usernameInput"
            class="bg-[#ffffff] rounded-lg p-2 mt-2 w-80 focus:outline-0 border border-[#8080808c]"
            placeholder="Username" type="text" [(ngModel)]="username">

        <hr class="my-2 h-px bg-[#00000021] border-[#69696923] border">

        <input name="passwordInput"
            class="block bg-[#ffffff] rounded-lg p-2 mt-2 w-80 focus:outline-0 border border-[#8080808c]"
            placeholder="Password" type="password" [(ngModel)]="password">
        <input name="confirmPasswordInput"
            class="block bg-[#ffffff] rounded-lg p-2 mt-2 w-80 focus:outline-0 border border-[#8080808c]"
            placeholder="Confirm Password" type="password" [(ngModel)]="confirmPassword">

        <button class="bg-[#5457ff] text-[#ffffff] block mx-auto rounded-xl mt-8 px-4 p-2 cursor-pointer"
            (click)="attemptRegistration()">Register</button>
        <h2 class="block text-base text-center justify-center mt-6 text-[rgb(26,26,26)]">Already have an account?</h2>
        <a routerLink="/login" routerLinkActive="active"
            class="block text-base font-bold text-center justify-center underline text-[#5457ff]">Login</a>
        <h3 class="text-xs max-w-xs text-center pt-8 text-[#444444]">By clicking 'Register' you agree to the Terms of
            Service and our
            Privacy
            Policy.</h3>
    </form>
</div>
