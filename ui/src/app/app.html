<div class="page">

  <nav>
    <div [routerLink]="auth.isLoggedIn() ? '/dashboard' : '/'" routerLinkActive="active" id="logo-text">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10"
          stroke-width="1.5"
          d="M12 7.333C12 5.5 10.5 4 8.667 4H2v12h6.708C12 16 12 19.334 12 19.334m0-12C12 5.5 13.5 4 15.333 4H22v12h-6.667C12 16 12 19.334 12 19.334m0-12v12m1.875 1.124A2.58 2.58 0 0 1 16.167 19H21m-10.875 1.458A2.54 2.54 0 0 0 7.833 19H3" />
      </svg>
      <h1>BKYZ</h1>
    </div>


    <div id="account-section">
      @if (!auth.isLoggedIn()) {
      <li>
        <a routerLink="/login" routerLinkActive="active">Login</a>
      </li>
      } @else {
      <li>
        <a routerLink="/" class="cursor-pointer" (click)="auth.logout()">Sign Out</a>
      </li>
      }
    </div>
  </nav>

  <main>
    <router-outlet />
  </main>

  <footer class="sticky bottom-0 flex items-center justify-between px-5 py-2 text-sm text-gray-500 border-t border-stone-300 bg-[#f1f1f1]/90 backdrop-blur-sm">
    <p>© 2026 BKYZ. All rights reserved.</p>
    <div class="flex gap-5">
      <a href="#" class="transition-colors hover:text-bkyz">GitHub</a>
      <a href="#" class="transition-colors hover:text-bkyz">About</a>
    </div>
  </footer>

</div>
