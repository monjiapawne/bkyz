<div class="page">

  <nav>
    <div [routerLink]="auth.isLoggedIn() ? '/dashboard' : '/'" routerLinkActive="active" id="logo-text">
      <h1 class="font-semibold">bkyz</h1>
    </div>

    @if (auth.isLoggedIn()) {
    <div class="flex ml-4">
      <li>
        <a routerLink="/playlists" routerLinkActive="active">Dashboard</a>
      </li>
      <li>
        <a routerLink="/library" routerLinkActive="active">Library</a>
      </li>
      @if (auth.user()?.is_admin) {
      <li>
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      </li>
      }
    </div>
    }

    <div id="account-section">
      @if (!auth.isLoggedIn()) {
      <li>
        <a routerLink="/login" routerLinkActive="active">Login</a>
      </li>
      } @else {
      <li>
        <a class="cursor-pointer" (click)="auth.logout()">Sign out</a>
      </li>
      }
    </div>
  </nav>

  <main>
    <router-outlet />
  </main>

  <app-notice-banner />

</div>
