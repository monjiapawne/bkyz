<app-form-dialog #dialog title="Edit user" [formGroup]="userForm" [save]="save" (saved)="saved.emit()">
    <app-field label="Username" name="username" />
    <app-field label="Admin" name="is_admin" type="checkbox" />
    <app-field label="Password" name="password" type="password" placeholder="Leave blank to keep" />
</app-form-dialog>
