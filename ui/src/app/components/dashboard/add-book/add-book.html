<app-form-dialog #dialog title="New book" [formGroup]="bookForm" [save]="save" submitLabel="Add Book" (saved)="onSaved($event)">
    <app-field label="Title" name="title" placeholder="Enter book title" />
    <app-field label="Authors" name="authors" placeholder="J.K. Rowling, Stephen King" />
    <app-field label="ISBN" name="isbn" />
    <app-field label="Number of Pages" name="number_of_pages" type="number" [min]="1" />
</app-form-dialog>
