<dialog #modal class="modal">

    <div class="text-sm text-gray-700">

        <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" (keydown.control.enter)="$event.preventDefault(); onSubmit()" class="space-y-2">

            <div>
                <label for="title" class="form-label">
                    Title
                </label>

                <input id="title" type="text" formControlName="title"
                    class="input-box w-full p-1.5" placeholder="Enter book title" />
            </div>

            <div>
                <label for="authors" class="form-label">
                    Authors
                </label>

                <input id="authors" type="text" formControlName="authors"
                    class="input-box w-full p-1.5" placeholder="J.K. Rowling, Stephen King" />
            </div>

            <div>
                <label for="isbn" class="form-label">
                    ISBN
                </label>

                <input id="isbn" type="text" formControlName="isbn"
                    class="input-box w-full p-1.5" />
            </div>

            <div>
                <label for="number_of_pages" class="form-label">
                    Number of Pages
                </label>

                <input id="number_of_pages" type="number" formControlName="number_of_pages"
                    class="input-box w-full p-1.5" min="1" />
            </div>

            <div class="flex gap-2 pt-2">

                <button type="submit" [disabled]="bookForm.invalid || isSubmitting()"
                    class="btn-primary flex-1 gap-2">

                    @if (isSubmitting()) {
                    <span class="spinner text-white"></span>
                    <span>Adding...</span>
                    } @else {
                    <span>Add Book</span>
                    }

                </button>

                <button type="button" (click)="modal.close()"
                    class="btn-neutral flex-1">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</dialog>
