<app-page sidebarTitle="Playlists" [title]="playlist()?.name" [description]="playlist()?.description">
    <div sidebar>
        @for (playlist of playlists(); track playlist.id) {
        <a [routerLink]="['/playlists', playlist.id]" routerLinkActive="bg-muted-hover font-semibold"
            [routerLinkActiveOptions]="{ exact: true }" [title]="playlist.description"
            class="flex items-center justify-between sidebar-link">
            <span class="truncate">{{ playlist.name }}</span>
            <span class="flex items-end gap-px h-3.5" [attr.aria-label]="playlist.tracks.length + ' books'">
                @for (book of playlist.tracks.slice(0, 12); track $index) {
                @let spine = spines[(playlist.id * 4 + $index) % spines.length];
                <span class="relative w-[5px] origin-bottom" [style.height.%]="spine.height"
                    [style.rotate.deg]="spine.tilt" [style.background-color]="spine.color">
                    <span class="absolute inset-x-0 top-1/4 h-px bg-white/70"></span>
                </span>
                }
            </span>
        </a>
        }
        <button type="button" (click)="addPlaylistModal.open()"
            class="block w-full sidebar-link text-left text-subtle cursor-pointer">+ New playlist</button>
    </div>

    @if (playlist()) {
    <ng-container actions>
        <button type="button" (click)="reordering.set(!reordering())" class="btn-neutral">{{ reordering() ? 'Done' : 'Reorder' }}</button>
        <button type="button" (click)="addPlaylistModal.open(playlist())" class="btn-neutral">Edit</button>
        <button type="button" (click)="searchBookModal.open()" class="btn-primary">Add book</button>
    </ng-container>
    }

    <div class="border border-line divide-y divide-line bg-surface">
        @for (track of tracks(); track track.id) {
        <app-track-row class="block" [track]="track" [book]="track.book" [reordering]="reordering()" (edit)="addTrackModal.open($event)" (history)="trackHistory.open($event)" (move)="onMove(track, $event)" (progressChange)="onProgress(track, $event)"/>
        } @empty {
        <div class="empty-state">No books yet</div>
        }
    </div>

    <app-add-playlist #addPlaylistModal (playlistAdded)="onPlaylistAdded($event)" (playlistDeleted)="confirmPlaylist.open()"></app-add-playlist>
    <app-confirm-dialog #confirmPlaylist resourceName="playlist" (confirmed)="deletePlaylist()" />

    <app-search-book #searchBookModal (bookSelected)="onBookSelected($event)"></app-search-book>

    <app-add-track #addTrackModal [playlistId]="playlistId()" [bookId]="selectedBookId" [playlists]="playlists()"
        (trackAdded)="loadDashboard()" (trackDeleted)="onDeleteTrack($event)">
    </app-add-track>
    <app-track-history #trackHistory [playlistId]="playlistId()" />
    <app-confirm-dialog #confirmTrack resourceName="track" (confirmed)="deleteTrack()" />
</app-page>
