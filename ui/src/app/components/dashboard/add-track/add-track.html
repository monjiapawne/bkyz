<app-form-dialog #dialog [title]="editing ? 'Edit track' : 'Add track'" [form]="trackForm" [submitting]="isSubmitting()" [deletable]="!!editing"
    [submitLabel]="editing ? 'Save' : 'Add Track'" (submitted)="onSubmit()" (deleted)="trackDeleted.emit(editing!)">
    <div [formGroup]="trackForm" class="space-y-2">
        <div class="flex items-center gap-2">
            <input id="active" type="checkbox" formControlName="active" />
            <label for="active" class="font-medium">
                Active
            </label>
        </div>

        @if (trackForm.value.active) {
        <app-field label="Position">
            <input type="number" formControlName="position" class="input-box w-full p-1.5" min="0" />
        </app-field>
        }

        <app-field label="Total">
            <input type="number" formControlName="total" class="input-box w-full p-1.5" min="1" />
        </app-field>

        <app-field label="Unit">
            <select formControlName="unit" class="input-box w-full p-1.5">
                <option value="pages">Pages</option>
                <option value="chapters">Chapters</option>
                <option value="%">Percent</option>
                <option value="other">Other</option>
            </select>

            @if (trackForm.value.unit === 'other'){
                <input type="text" formControlName="customUnit" placeholder="e.g. sections"
                class="input-box w-full p-1.5 mt-1"/>
            }
        </app-field>

        <app-field label="Medium">
            <select formControlName="medium" class="input-box w-full p-1.5">
                <option value="physical">Physical</option>
                <option value="ebook">E-book</option>
                <option value="audiobook">Audiobook</option>
            </select>
        </app-field>

        <app-field label="Notes">
            <textarea formControlName="notes" rows="2" maxlength="255" class="input-box h-auto w-full p-1.5"></textarea>
        </app-field>

        <app-field label="Playlist">
            <select formControlName="playlistId" class="input-box w-full p-1.5">
                @for (playlist of playlists; track playlist.id) {
                <option [ngValue]="playlist.id">{{ playlist.name }}</option>
                }
            </select>
        </app-field>
    </div>
</app-form-dialog>
