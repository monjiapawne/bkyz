<dialog #modal class="modal">

    <div class="text-sm text-gray-700">

        <form [formGroup]="trackForm" (ngSubmit)="onSubmit()" class="space-y-2">

            <div>
                <label for="position" class="form-label">
                    Position
                </label>

                <input id="position" type="number" formControlName="position"
                    class="input-box w-full p-1.5" min="0" />
            </div>

            <div>
                <label for="total" class="form-label">
                    Total
                </label>

                <input id="total" type="number" formControlName="total"
                    class="input-box w-full p-1.5" min="1" />
            </div>

            <div>
                <label for="unit" class="form-label">
                    Unit
                </label>

                <select id="unit" formControlName="unit" class="input-box w-full p-1.5">
                    <option value="pages">Pages</option>
                    <option value="chapters">Chapters</option>
                    <option value="%">Percent</option>
                    <option value="other">Other</option>
                </select>

                @if (trackForm.value.unit === 'other'){
                    <input type="text" formControlName="customUnit" placeholder="e.g. sections"
                    class="input-box w-full p-1.5 mt-1"/>
                }
            </div>

            <div>
                <label for="medium" class="form-label">
                    Medium
                </label>

                <select id="medium" formControlName="medium" class="input-box w-full p-1.5">
                    <option value="physical">Physical</option>
                    <option value="ebook">E-book</option>
                    <option value="audiobook">Audiobook</option>
                </select>
            </div>

            <div class="flex items-center gap-2">
                <input id="active" type="checkbox" formControlName="active" />
                <label for="active" class="font-medium">
                    Active
                </label>
            </div>

            <div>
                <label for="notes" class="form-label">
                    Notes
                </label>

                <textarea id="notes" formControlName="notes" rows="2" maxlength="255"
                    class="input-box w-full p-1.5"></textarea>
            </div>

            <div class="flex gap-2 pt-2">

                <button type="submit" [disabled]="trackForm.invalid || isSubmitting()"
                    class="btn-primary flex-1 gap-2">

                    @if (isSubmitting()) {
                    <span class="spinner text-white"></span>
                    <span>Adding...</span>
                    } @else {
                    <span>{{ editing ? 'Save' : 'Add Track' }}</span>
                    }

                </button>

                <button type="button" (click)="modal.close()"
                    class="btn-neutral flex-1">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</dialog>
