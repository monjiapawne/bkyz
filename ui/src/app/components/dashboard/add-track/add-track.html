<app-form-dialog #dialog [title]="editing ? 'Edit track' : 'Add track'" [formGroup]="trackForm" [save]="save"
    [deletable]="!!editing" [submitLabel]="editing ? 'Save' : 'Add Track'"
    [savedMessage]="editing ? 'Track updated' : 'Book added to playlist'"
    (saved)="trackAdded.emit()" (deleted)="trackDeleted.emit(editing!)">
    <app-field label="Active" name="active" type="checkbox" />
    @if (trackForm.value.active) {
    <app-field label="Position" name="position" type="number" [min]="0" />
    }
    <app-field label="Total" name="total" type="number" [min]="1" />
    <app-field label="Unit" name="unit" type="select" [options]="units" />
    @if (trackForm.value.unit === 'other') {
    <app-field label="Custom unit" name="customUnit" placeholder="e.g. sections" />
    }
    <app-field label="Medium" name="medium" type="select" [options]="mediums" />
    @if (!trackForm.value.active) {
    <app-field label="Rating" name="rating" type="rating" />
    }
    @if (editing) {
    <app-field label="Last read" name="last_read_at" type="date" />
    <div>
        <span class="form-label">Labels</span>
        <div class="flex flex-wrap gap-1.5 mb-2">
            @for (label of labels(); track label.id) {
            @if (labelIds.includes(label.id)) {
            <button type="button" class="tag cursor-pointer hover:text-ink" (click)="setLabelIds(labelIds.filter(id => id !== label.id))">{{ label.name }} ×</button>
            }
            }
        </div>
        <select class="input-box w-full" (change)="setLabelIds([...labelIds, +sel.value]); sel.value = ''" #sel>
            <option value="">Add label</option>
            @for (label of labels(); track label.id) {
            @if (!labelIds.includes(label.id)) {
            <option [value]="label.id">{{ label.name }}</option>
            }
            }
        </select>
        <div class="flex gap-2 mt-2">
            <input type="text" placeholder="New label" maxlength="50" class="input-box flex-1 min-w-0" (keydown.enter)="$event.preventDefault(); createLabel(newLabel)" #newLabel />
            <button type="button" class="btn-neutral" (click)="createLabel(newLabel)">Create</button>
        </div>
    </div>
    }
    <app-field label="Notes" name="notes" type="textarea" [rows]="2" [maxlength]="255" />
    <app-field label="Playlist" name="playlistId" type="select" [options]="playlistOptions" />
</app-form-dialog>
