<dialog #modal class="modal">

    <div class="py-4 text-gray-700">

        <form [formGroup]="trackForm" (ngSubmit)="onSubmit()" class="space-y-4">

            <div>
                <label for="position" class="block mb-1 font-medium">
                    Position
                </label>

                <input id="position" type="number" formControlName="position"
                    class="input-box w-full" min="0" />
            </div>

            <div>
                <label for="total" class="block mb-1 font-medium">
                    Total
                </label>

                <input id="total" type="number" formControlName="total"
                    class="input-box w-full" min="1" />
            </div>

            <div>
                <label for="unit" class="block mb-1 font-medium">
                    Unit
                </label>

                <select id="unit" formControlName="unit" class="input-box w-full">
                    <option value="pages">Pages</option>
                    <option value="chapters">Chapters</option>
                    <option value="percent">Percent</option>
                    <option value="other">Other</option>
                </select>

                @if (trackForm.value.unit === 'other'){
                    <input type="text" formControlName="customUnit" placeholder="e.g. sections"
                    class="input-box w-full mt-2"/>
                }
            </div>

            <div>
                <label for="medium" class="block mb-1 font-medium">
                    Medium
                </label>

                <select id="medium" formControlName="medium" class="input-box w-full">
                    <option value="physical">Physical</option>
                    <option value="ebook">E-book</option>
                    <option value="audiobook">Audiobook</option>
                </select>
            </div>

            <div class="flex flex-col justify-center">

                <button type="submit" [disabled]="trackForm.invalid || isSubmitting()"
                    class="btn-primary gap-2 my-4">

                    @if (isSubmitting()) {
                    <span class="h-5 w-5 animate-spin rounded-full border-2 border-white border-t-transparent"></span>
                    <span>Adding...</span>
                    } @else {
                    <span>{{ editing ? 'Save' : 'Add Track' }}</span>
                    }

                </button>

                <button type="button" (click)="modal.close()"
                    class="btn-neutral">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</dialog>
