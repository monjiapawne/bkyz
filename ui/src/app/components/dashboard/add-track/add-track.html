<app-form-dialog #dialog [title]="editing ? 'Edit track' : 'Add track'" [formGroup]="trackForm" [save]="save"
    [deletable]="!!editing" [submitLabel]="editing ? 'Save' : 'Add Track'"
    (saved)="trackAdded.emit()" (deleted)="trackDeleted.emit(editing!)">
    <app-field label="Active" name="active" type="checkbox" />
    @if (trackForm.value.active) {
    <app-field label="Position" name="position" type="number" [min]="0" />
    }
    <app-field label="Total" name="total" type="number" [min]="1" />
    <app-field label="Unit" name="unit" type="select" [options]="units" />
    @if (trackForm.value.unit === 'other') {
    <app-field label="Custom unit" name="customUnit" placeholder="e.g. sections" />
    }
    <app-field label="Medium" name="medium" type="select" [options]="mediums" />
    <app-field label="Notes" name="notes" type="textarea" [rows]="2" [maxlength]="255" />
    <app-field label="Playlist" name="playlistId" type="select" [options]="playlistOptions" />
</app-form-dialog>
