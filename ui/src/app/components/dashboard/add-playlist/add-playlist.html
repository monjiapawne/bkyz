<app-form-dialog #dialog [title]="editing ? 'Edit playlist' : 'New playlist'" [formGroup]="playlistForm" [save]="save"
    [deletable]="!!editing" [submitLabel]="editing ? 'Save' : 'Add Playlist'"
    [savedMessage]="playlistForm.value.name + (editing ? ' updated' : ' created')"
    (saved)="playlistAdded.emit($event.id)" (deleted)="playlistDeleted.emit()">
    <app-field label="Name" name="name" />
    <app-field label="Description" name="description" type="textarea" />
    <app-field label="Show progress" name="show_progress" type="select" [options]="progressOptions" />
    @if (editing) {
    <app-move-buttons class="block" (move)="move($event)" />
    }
</app-form-dialog>
