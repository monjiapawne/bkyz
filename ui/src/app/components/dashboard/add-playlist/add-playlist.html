<dialog #modal class="modal">

    <div class="text-sm text-gray-700">

        <form [formGroup]="playlistForm" (ngSubmit)="onSubmit()" (keydown.control.enter)="$event.preventDefault(); onSubmit()" class="space-y-2">

            <div>
                <label for="name" class="form-label">
                    Name
                </label>

                <input id="name" type="text" formControlName="name"
                    class="input-box w-full p-1.5" />
            </div>

            <div>
                <label for="description" class="form-label">
                    Description
                </label>

                <textarea id="description" formControlName="description" rows="3"
                    class="input-box w-full p-1.5"></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-2">

                @if (editing) {
                <button type="button" (click)="modal.close(); playlistDeleted.emit()"
                    class="btn-danger mr-auto">
                    Delete
                </button>
                }

                <button type="button" (click)="modal.close()"
                    class="btn-neutral">
                    Cancel
                </button>

                <button type="submit" [disabled]="playlistForm.invalid || isSubmitting()"
                    class="btn-primary gap-2">

                    @if (isSubmitting()) {
                    <span class="spinner text-white"></span>
                    }
                    <span>{{ editing ? 'Save' : 'Add Playlist' }}</span>

                </button>

            </div>

        </form>

    </div>

</dialog>
