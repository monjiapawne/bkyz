<div class="flex gap-5 overflow-hidden rounded-xl border border-stone-300 transition-colors duration-200 hover:bg-black/[0.01]">
    <img [src]="book().cover_url" [alt]="book().title" class="block shrink-0 h-44 w-32 object-fill border-r border-black/10">

    <div class="flex flex-col flex-1 min-w-0 py-3 pr-4">
        <div class="flex items-start gap-3">
            <div class="min-w-0">
                <div class="text-bkyz font-bold text-sm leading-none mb-1.5">
                    {{ track().medium | uppercase }}
                </div>
                <div class="font-serif font-bold text-3xl leading-tight">
                    {{ book().title }}
                </div>
                <div class="text-lg text-gray-500 leading-snug">
                    {{ book().authors }}
                    @if (year()) {
                    <span class="font-serif text-gray-400">({{ year() }})</span>
                    }
                </div>
                @if (track().notes) {
                <p class="mt-1 text-sm text-gray-600 italic leading-tight whitespace-pre-line">{{ track().notes }}</p>
                }
            </div>

            <div class="ml-auto flex shrink-0 gap-3">
                <button type="button" class="btn-icon size-5" (click)="edit.emit(track())" aria-label="Edit a track">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
                        <path d="M0 0h16v16H0z" fill="none" />
                        <path fill="currentColor"
                            d="m12.146 7.854l-5.932 5.932c-.14.14-.318.235-.511.274l-3.232.646a1 1 0 0 1-1.176-1.177l.646-3.232a1 1 0 0 1 .273-.51l5.932-5.933zm-1.353-6.647a1 1 0 0 1 1.414 0l2.586 2.586a1 1 0 0 1 0 1.414l-1.94 1.94l-4-4z" />
                    </svg>
                </button>
            </div>
        </div>

        @if (track().active) {
        <div class="mt-auto">
            <div class="flex items-baseline justify-between text-sm text-gray-500 mb-1.5">
                <span>{{ progress() }}%</span>

                @if (track().total) {
                <div class="flex items-baseline gap-1 whitespace-nowrap">
                    @if (position() !== track().position) {
                    <button type="button" class="mr-2 text-bkyz hover:underline cursor-pointer" (click)="progressChange.emit(position())">Save</button>
                    }
                    <label class="flex items-baseline gap-1 cursor-text">
                        <input type="text" inputmode="numeric" class="p-0 bg-transparent text-right border-b border-gray-400 focus:outline-0 focus:border-bkyz"
                            [value]="position()" [style.width.ch]="(position() + '').length + 0.5" (input)="position.set(+pos.value)" (keydown.enter)="progressChange.emit(position())" (keydown.escape)="position.set(track().position); pos.blur()" #pos />
                        <span>/ {{ track().total }} {{ track().unit }}</span>
                    </label>
                </div>
                }
            </div>

            <div class="h-2 w-full overflow-hidden rounded-full bg-gray-300">
                <div class="h-full rounded-full bg-bkyz-light transition-[width] duration-700 ease-out" [style.width.%]="progress()"></div>
            </div>
        </div>
        }
    </div>
</div>
