<div class="flex h-36 md:h-40 gap-3 px-4 py-3 hover:bg-muted-hover/50">
    <img [src]="book().cover_url" [alt]="book().title" class="hidden min-[300px]:block shrink-0 h-full aspect-2/3 object-cover border border-line">

    <div class="flex flex-col flex-1 min-w-0">
        <div class="flex items-start gap-3 flex-1 min-h-0">
            <div class="flex flex-col flex-wrap content-start flex-1 min-w-0 h-full overflow-hidden">
                <div class="w-full text-base md:text-lg font-semibold leading-snug line-clamp-2" [title]="book().title">
                    {{ book().title }}
                </div>
                <div class="w-full">
                    <div class="text-sm md:text-base text-subtle truncate">
                        {{ book().authors }}
                        @if (year()) {
                        <span>({{ year() }})</span>
                        }
                    </div>
                    @if (track().active) {
                    <div class="text-xs text-subtle/70">last read {{ lastRead() }}</div>
                    }
                </div>
                <div class="w-full text-bkyz font-bold text-xs md:text-sm leading-none mt-1.5">
                    {{ track().medium | uppercase }}
                </div>
            </div>

            <div class="ml-auto flex shrink-0 gap-3">
                <button type="button" class="btn-icon size-5" (click)="edit.emit(track())" aria-label="Edit a track">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
                        <path d="M0 0h16v16H0z" fill="none" />
                        <path fill="currentColor"
                            d="m12.146 7.854l-5.932 5.932c-.14.14-.318.235-.511.274l-3.232.646a1 1 0 0 1-1.176-1.177l.646-3.232a1 1 0 0 1 .273-.51l5.932-5.933zm-1.353-6.647a1 1 0 0 1 1.414 0l2.586 2.586a1 1 0 0 1 0 1.414l-1.94 1.94l-4-4z" />
                    </svg>
                </button>
            </div>
        </div>

        @if (track().active) {
        <div class="shrink-0">
            <div class="flex items-baseline justify-between text-sm md:text-base pointer-coarse:text-base text-subtle mb-1">
                <span>{{ progress() }}%</span>

                @if (track().total) {
                <div class="flex items-baseline gap-1 whitespace-nowrap">
                    @if (position() !== track().position) {
                    <button type="button" class="mr-2 text-bkyz hover:underline cursor-pointer" (click)="progressChange.emit(position())">Save</button>
                    }
                    <label class="flex items-baseline gap-1 cursor-text">
                        <input type="text" inputmode="numeric" class="box-content px-1 leading-none bg-surface border border-line text-center focus:outline-1 focus:outline-bkyz"
                            [value]="position()" [style.width.ch]="(position() + '').length" (input)="position.set(+pos.value)" (click)="pos.setSelectionRange(pos.value.length, pos.value.length)" (keydown.enter)="progressChange.emit(position())" (keydown.escape)="position.set(track().position); pos.blur()" #pos />
                        <span>/ {{ track().total }} {{ track().unit }}</span>
                    </label>
                </div>
                }
            </div>

            <div class="h-1.5 w-full overflow-hidden bg-muted-hover">
                <div class="h-full bg-bkyz transition-[width] duration-700 ease-out" [style.width.%]="progress()"></div>
            </div>
        </div>
        }
    </div>
</div>
