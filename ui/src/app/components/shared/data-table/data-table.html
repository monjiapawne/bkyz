<div class="overflow-x-auto border border-line bg-surface">
<table class="w-full text-left">
    <thead class="border-b border-line bg-sidebar text-sm text-subtle">
        <tr>
            @for (col of columns(); track col.key) {
            <th class="px-4 py-2 font-semibold whitespace-nowrap">{{ col.label }}</th>
            }
            @if (editable()) {
            <th></th>
            }
        </tr>
    </thead>
    <tbody class="divide-y divide-line">
        @for (row of rows(); track row.id) {
        <tr>
            @for (col of columns(); track col.key) {
            <td class="px-4 py-2">
                @if (row[col.key] === true) {
                <app-icon name="check" class="size-4" aria-label="Yes" />
                } @else if (row[col.key] !== false) {
                {{ display(row[col.key]) }}
                }
            </td>
            }
            @if (editable()) {
            <td class="w-0 px-4 py-2">
                <button type="button" class="btn-icon size-4 align-middle" (click)="edit.emit(row)" aria-label="Edit">
                    <app-icon name="edit" />
                </button>
            </td>
            }
        </tr>
        }
    </tbody>
</table>
</div>
