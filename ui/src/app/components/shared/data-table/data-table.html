<table class="w-full border border-line bg-surface text-left">
    <thead class="border-b border-line text-sm text-subtle">
        <tr>
            @for (col of columns(); track col.key) {
            <th class="px-4 py-2 font-semibold">{{ col.label }}</th>
            }
            @if (editable()) {
            <th></th>
            }
        </tr>
    </thead>
    <tbody class="divide-y divide-line">
        @for (row of rows(); track row.id) {
        <tr>
            @for (col of columns(); track col.key) {
            <td class="px-4 py-2">
                @if (row[col.key] === true) {
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Yes">
                    <path d="M5 12l5 5L20 7" />
                </svg>
                } @else if (row[col.key] !== false) {
                {{ display(row[col.key]) }}
                }
            </td>
            }
            @if (editable()) {
            <td class="w-0 px-4 py-2">
                <button type="button" class="btn-icon size-4 align-middle" (click)="edit.emit(row)" aria-label="Edit">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16">
                        <path fill="currentColor"
                            d="m12.146 7.854l-5.932 5.932c-.14.14-.318.235-.511.274l-3.232.646a1 1 0 0 1-1.176-1.177l.646-3.232a1 1 0 0 1 .273-.51l5.932-5.933zm-1.353-6.647a1 1 0 0 1 1.414 0l2.586 2.586a1 1 0 0 1 0 1.414l-1.94 1.94l-4-4z" />
                    </svg>
                </button>
            </td>
            }
        </tr>
        }
    </tbody>
</table>
