@if (notifications.notification(); as n) {
<div class="fixed bottom-4 inset-x-4 md:left-auto md:max-w-md z-30 flex items-center gap-3 px-4 py-3 text-sm shadow-md border"
    [class]="n.type === 'error' ? 'bg-danger-subtle border-line' : 'bg-bkyz border-bkyz text-white'" role="status">
    <span class="flex-1">{{ n.message }}</span>
    <button type="button" (click)="notifications.dismiss()" class="size-4 shrink-0 opacity-70 hover:opacity-100 cursor-pointer" aria-label="Dismiss">
        <app-icon name="close" class="size-full" />
    </button>
</div>
}
