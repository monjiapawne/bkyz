<div class="flex min-h-[calc(100vh-3rem)]">
    @if (sidebarTitle()) {
    <aside [class.hidden]="!sidebarOpen()"
        class="fixed top-12 bottom-0 left-0 z-20 w-full md:w-60 shrink-0 border-r border-line bg-sidebar md:static">
        <div class="flex items-center justify-between px-3 py-2 text-sm md:text-xs font-semibold text-subtle">
            {{ sidebarTitle() }}
            <button type="button" (click)="sidebarOpen.set(false)" class="btn-icon size-4" aria-label="Hide sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <rect x="3" y="4" width="18" height="16" />
                    <path d="M9 4v16" />
                </svg>
            </button>
        </div>
        <ng-content select="[sidebar]" />
    </aside>
    }

    <section class="flex-1 min-w-0 px-4 md:px-6 py-4">
        @if (sidebarTitle()) {
        <button type="button" (click)="sidebarOpen.set(true)" aria-label="Show sidebar" [class.invisible]="sidebarOpen()"
            class="-ml-4 md:-ml-6 -mt-4 mb-3 flex px-3 py-2 text-subtle bg-sidebar border-r border-b border-line hover:text-ink cursor-pointer">
            <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <rect x="3" y="4" width="18" height="16" />
                <path d="M9 4v16" />
            </svg>
        </button>
        }
        <div class="max-w-5xl mx-auto">
            <div class="flex items-start gap-2 mb-4">
                <div class="min-w-0">
                    <h1 class="text-2xl md:text-3xl font-semibold truncate">{{ title() }}</h1>
                    @if (description()) {
                    <p class="text-base md:text-lg text-subtle">{{ description() }}</p>
                    }
                </div>
                <div class="ml-auto flex shrink-0 gap-2">
                    <ng-content select="[actions]" />
                </div>
            </div>
            <ng-content />
        </div>
    </section>
</div>
