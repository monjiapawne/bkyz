<app-dialog #dialog [heading]="title()">
    <form (submit)="$event.preventDefault(); submit()" (keydown.control.enter)="$event.preventDefault(); submit()" class="text-sm text-ink">
        <div class="space-y-2">
            <ng-content />
        </div>

        <div class="flex justify-end gap-2 pt-4">
            @if (deletable()) {
            <button type="button" (click)="close(); deleted.emit()" class="btn-danger mr-auto">Delete</button>
            }
            <button type="submit" [disabled]="form.invalid || submitting()" class="btn-primary gap-2">
                @if (submitting()) {
                <span class="spinner text-white"></span>
                }
                <span>{{ submitLabel() }}</span>
            </button>
        </div>
    </form>
</app-dialog>
