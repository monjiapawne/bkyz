<div class="auth-page">
    <form class="auth-card">

        <img src="logo.svg" alt="bkyz" class="auth-logo" draggable="false">

        <h1 class="auth-title">Register</h1>
        @if(invalidRegisterErrorMessage())
        {
        <div class="auth-error">{{
            invalidRegisterErrorMessage() }}</div>
        }

        <input name="usernameInput"
            class="input-box w-full mt-2"
            placeholder="Username" type="text" [(ngModel)]="username">

        <input name="passwordInput"
            class="input-box w-full mt-2"
            placeholder="Password" type="password" [(ngModel)]="password">
        <input name="confirmPasswordInput"
            class="input-box w-full mt-2"
            placeholder="Confirm Password" type="password" [(ngModel)]="confirmPassword">

        <button class="btn-primary block mx-auto mt-6" (click)="attemptRegistration()">Register</button>
        <h2 class="block text-base text-center mt-4">Already have an account?</h2>
        <a routerLink="/login" routerLinkActive="active"
            class="auth-link">Login</a>
        <h3 class="text-xs text-center pt-8 text-subtle">By clicking 'Register' you agree to the Terms of
            Service and our
            Privacy
            Policy.</h3>
    </form>
</div>
