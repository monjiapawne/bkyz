<div class="auth-page">
    <form class="auth-card">

        <img src="logo.svg" alt="bkyz" class="auth-logo" draggable="false">
        <h1 class="auth-title">Login</h1>
        @if(invalidLoginErrorMessage())
        {
        <div class="auth-error">{{
            invalidLoginErrorMessage() }}</div>
        }
        <input name="usernameInput" class="input-box w-full mt-2"
            placeholder="Username" type="text" [(ngModel)]="username">

        <input name="passwordInput" class="input-box w-full mt-2"
            placeholder="Password" type="password" [(ngModel)]="password">

        <label class="flex items-center gap-2 mt-4 text-sm text-ink">
            <input name="rememberMeInput" type="checkbox" [(ngModel)]="rememberMe">
            Remember me
        </label>
        <button (click)="attemptLogin()" class="btn-primary block mx-auto mt-6">Sign
            in</button>
        <h2 class="block text-base text-center mt-4">Don't have an account?</h2>
        <a routerLink="/register" routerLinkActive="active"
            class="auth-link">Register</a>
    </form>
</div>
