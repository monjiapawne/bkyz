<div class="flex justify-center items-center min-h-[calc(100dvh-120px)]">
    <form class="bg-muted border  border-[#969696a6] p-10">

        <img src="logo.svg" alt="bkyz" class="mx-auto block m-6 w-24 h-24" draggable="false">
        <h1 class="font-bold text-4xl text-center mb-10 text-ink">Login</h1>
        @if(invalidLoginErrorMessage())
        {
        <div class="text-xs max-w-xs text-center text-error mb-6">{{
            invalidLoginErrorMessage() }}</div>
        }
        <input name="usernameInput" class="input-box w-80 mt-2"
            placeholder="Username" type="text" [(ngModel)]="username">

        <input name="passwordInput" class="input-box w-80 mt-2"
            placeholder="Password" type="password" [(ngModel)]="password">
        <button (click)="attemptLogin()" class="btn-primary block mx-auto mt-8">Sign
            in</button>
        <h2 class="block text-base text-center justify-center mt-6 text-ink">Don't have an account?</h2>
        <a routerLink="/register" routerLinkActive="active"
            class="block text-base font-bold text-center justify-center underline text-bkyz">Register</a>
    </form>
</div>
