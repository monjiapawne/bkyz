services:
  api:
    build:
      context: ../backend/
      dockerfile: Dockerfile
    environment:
      - APP_CONFIG=config.ProdConfig
      - DATABASE_URL=postgresql+psycopg://bkyz:${POSTGRES_PASSWORD:-password}@db:5432/bkyz
      - SECRET_KEY=${SECRET_KEY:-please_change_me}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ACCESS_LOG=${ACCESS_LOG:-true}

  ui:
    build:
      context: ../frontend/
      dockerfile: Dockerfile
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bkyz}
      - POSTGRES_DB=${POSTGRES_DB:-bkyz}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkyz"]
      interval: 5s
      retries: 10