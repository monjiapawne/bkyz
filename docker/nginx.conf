events {}
http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location /api {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $ui http://ui:8080;
            proxy_pass $ui;
            proxy_set_header Host $host;
        }
    }
}